<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Docs - Novo Evento Editorial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface">
    <!-- Top Nav -->
    <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/10">
        <div class="flex justify-between items-center w-full px-8 h-20 max-w-[1440px] mx-auto">
            <div class="flex items-center gap-4">
                <a href="/dashboard.html" class="flex items-center text-primary hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined">close</span>
                </a>
                <div class="text-2xl font-bold tracking-tighter text-primary brand-font">Memory Docs</div>
            </div>
        </div>
    </header>

    <main class="max-w-[800px] mx-auto px-8 py-16 animate-fade-in">
        <div class="text-center mb-16">
            <span class="text-[10px] font-bold text-primary uppercase tracking-[0.3em] mb-4 block">Nova Curadoria</span>
            <h1 class="text-5xl font-bold font-manrope text-on-surface tracking-tight mb-4">Crie uma nova experiência</h1>
            <p class="text-secondary text-lg">Defina os detalhes fundamentais do seu próximo evento editorial.</p>
        </div>

        <form id="create-event-form" class="space-y-12">
            <!-- Basic Info -->
            <section class="space-y-8">
                <div>
                    <label class="block text-xs font-bold text-secondary uppercase tracking-widest mb-4">Título do Evento</label>
                    <input type="text" id="event-name" required placeholder="Ex: Galeria de Inverno 2026" 
                           class="w-full bg-surface-container-highest border-none rounded-[1.5rem] px-8 py-6 text-xl font-bold font-manrope text-on-surface focus:ring-4 focus:ring-primary/10 placeholder:text-secondary/20">
                </div>

                <div>
                    <label class="block text-xs font-bold text-secondary uppercase tracking-widest mb-4">Narrativa / Descrição</label>
                    <textarea id="event-desc" rows="4" placeholder="Descreva a alma deste evento..." 
                              class="w-full bg-surface-container-highest border-none rounded-[1.5rem] px-8 py-6 text-sm leading-relaxed text-secondary focus:ring-4 focus:ring-primary/10 placeholder:text-secondary/20"></textarea>
                </div>
            </section>

            <!-- Logistics -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-bold text-secondary uppercase tracking-widest mb-4">Data e Hora</label>
                    <input type="datetime-local" id="event-date" required 
                           class="w-full bg-surface-container-highest border-none rounded-2xl px-6 py-4 text-sm font-semibold text-on-surface focus:ring-4 focus:ring-primary/10">
                </div>
                <div>
                    <label class="block text-xs font-bold text-secondary uppercase tracking-widest mb-4">Capacidade de Convidados</label>
                    <input type="number" id="event-capacity" required min="1" placeholder="Ex: 150" 
                           class="w-full bg-surface-container-highest border-none rounded-2xl px-6 py-4 text-sm font-semibold text-on-surface focus:ring-4 focus:ring-primary/10">
                </div>
            </div>

            <!-- Advanced -->
            <div class="bg-surface-container-lowest rounded-[2.5rem] shadow-[0px_10px_40px_rgba(25,28,30,0.04)] overflow-hidden p-8 border border-primary/10">
                <div class="flex items-center gap-4 mb-6">
                    <span class="material-symbols-outlined text-primary">diversity_3</span>
                    <h3 class="text-sm font-bold text-on-surface font-manrope">Regras de Acompanhantes</h3>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs font-medium text-secondary">Máximo de dependentes por convidado principal</label>
                    <input type="number" id="event-max-deps" min="0" value="0" 
                           class="w-24 bg-white border-none rounded-xl px-4 py-2 text-center text-sm font-bold text-primary focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <div id="error-message" class="hidden text-primary text-xs font-bold text-center px-6 py-4 bg-primary/5 rounded-2xl border border-primary/20"></div>

            <!-- Actions -->
            <div class="pt-8 flex flex-col md:flex-row items-center gap-6">
                <button type="submit" class="w-full md:w-auto px-12 py-5 bg-primary text-white font-bold rounded-full shadow-xl shadow-primary/20 hover:scale-105 active:scale-95 transition-all text-sm uppercase tracking-widest">
                    Publicar Evento
                </button>
                <a href="/dashboard.html" class="text-secondary text-xs font-bold uppercase tracking-widest hover:text-primary transition-colors">Voltar sem salvar</a>
            </div>
        </form>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/create-event.js"></script>
</body>
</html>
