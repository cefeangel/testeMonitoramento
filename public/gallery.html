<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Docs - Galeria Editorial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface">
    <!-- Top Nav -->
    <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-on-surface/10">
        <div class="flex justify-between items-center w-full px-8 h-20 max-w-[1440px] mx-auto">
            <div class="flex items-center gap-4">
                <a id="back-to-event" href="/dashboard.html" class="flex items-center text-primary hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div class="text-2xl font-bold tracking-tighter text-primary brand-font">Memory Docs</div>
            </div>
            
            <nav class="hidden md:flex items-center space-x-8 font-manrope text-sm font-semibold tracking-tight">
            </nav>

            <div class="flex items-center gap-6">
                <!-- Dark Mode Toggle -->
                <button id="dark-mode-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-secondary hover:bg-surface-container-highest transition-all active:scale-90" title="Alternar Tema">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block">light_mode</span>
                </button>

                <button id="logout-btn" class="text-secondary hover:text-primary transition-all active:scale-95 flex items-center gap-2">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="hidden lg:block text-xs font-bold uppercase tracking-widest">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-8 py-12">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 animate-fade-in group">
            <div>
                <p class="text-[10px] font-bold text-primary uppercase tracking-[0.2em] mb-3">Arquivo Visual</p>
                <h1 id="event-title" class="text-4xl md:text-5xl font-bold font-manrope text-on-surface mb-2 tracking-tight">Galeria de Mídia</h1>
                
                <!-- Tab Navigation -->
                <div class="flex items-center gap-8 mt-6 border-b border-on-surface/5 pb-0">
                    <button id="tab-all" class="pb-4 text-xs font-bold uppercase tracking-widest border-b-2 border-primary text-primary transition-all">Fotos Recentes</button>
                    <button id="tab-highlights" class="pb-4 text-xs font-bold uppercase tracking-widest border-b-2 border-transparent text-secondary hover:text-primary transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm">auto_awesome</span>
                        Destaques
                    </button>
                </div>
            </div>
            <div class="flex gap-4 mt-8 md:mt-0">
                <button id="download-all" class="bg-surface-container-highest text-secondary hover:text-primary px-8 py-4 rounded-full font-bold text-xs uppercase tracking-widest transition-all flex items-center gap-2 border border-on-surface/5">
                    <span class="material-symbols-outlined text-lg text-primary">download</span>
                    Baixar Tudo
                </button>
                <label for="upload-photo" class="cursor-pointer bg-primary text-white px-8 py-4 rounded-full font-bold text-xs uppercase tracking-widest hover:shadow-lg transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">add_photo_alternate</span>
                    Fazer Upload
                    <input type="file" id="upload-photo" class="hidden" accept="image/*,video/*">
                </label>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="columns-1 md:columns-2 lg:columns-3 xl:columns-4 gap-8 space-y-8 min-h-[400px]">
            <!-- Photos dynamically injected -->
        </div>

        <!-- Pagination -->
        <div id="pagination-container" class="flex justify-center items-center gap-2 mt-12 mb-20 animate-fade-in group">
            <!-- Buttons injected here -->
        </div>

        <!-- Loading State -->
        <div id="loading-gallery" class="flex flex-col items-center justify-center py-20 opacity-30">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-sm font-manrope font-semibold">Buscando mídias...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-gallery" class="hidden flex flex-col items-center justify-center py-20 animate-fade-in">
            <span class="material-symbols-outlined text-6xl text-secondary/10 mb-6">photo_library</span>
            <p class="text-lg font-manrope font-bold text-secondary/40">Nenhuma foto ainda.</p>
        </div>
    </main>

    <!-- Photo Modal (Overlay / Lightbox) -->
    <div id="photo-overlay" class="fixed inset-0 bg-on-surface/95 backdrop-blur-xl z-[200] flex items-center justify-center hidden opacity-0 transition-opacity duration-500 overflow-hidden cursor-zoom-out">
        <!-- Overlay Navigation & Actions -->
        <div class="absolute top-0 inset-x-0 h-24 flex items-center justify-between px-8 bg-gradient-to-b from-black/40 to-transparent z-10 pointer-events-none">
            <div class="flex items-center gap-4 pointer-events-auto">
                <span class="text-white/70 font-manrope text-xs font-bold uppercase tracking-widest" id="overlay-index">FOTO 01 / 12</span>
            </div>
            <div class="flex items-center gap-6 pointer-events-auto">
                <button id="download-overlay" class="text-white/60 hover:text-white transition-all flex items-center gap-2 group p-2 hover:bg-white/10 rounded-full">
                    <span class="material-symbols-outlined text-3xl">download</span>
                </button>
                <button id="close-overlay" class="text-white/60 hover:text-white transition-all p-2 hover:bg-white/10 rounded-full">
                    <span class="material-symbols-outlined text-4xl">close</span>
                </button>
            </div>
        </div>

        <!-- Arrows -->
        <button id="prev-photo" class="absolute left-8 w-16 h-16 rounded-full flex items-center justify-center text-white/30 hover:text-white hover:bg-white/10 transition-all z-20 group">
            <span class="material-symbols-outlined text-5xl group-hover:-translate-x-1 transition-transform">chevron_left</span>
        </button>
        <button id="next-photo" class="absolute right-8 w-16 h-16 rounded-full flex items-center justify-center text-white/30 hover:text-white hover:bg-white/10 transition-all z-20 group">
            <span class="material-symbols-outlined text-5xl group-hover:translate-x-1 transition-transform">chevron_right</span>
        </button>

        <!-- Image Wrapper (Zoomable) -->
        <div id="zoom-container" class="relative w-full h-full flex items-center justify-center p-12 transition-transform duration-500 ease-out cursor-zoom-in">
            <img id="overlay-img" src="" alt="Photo Full" class="max-w-full max-h-full object-contain rounded-xl shadow-[0_40px_100px_rgba(0,0,0,0.5)] transition-all duration-700 ease-in-out select-none scale-90 opacity-0 hidden">
            <video id="overlay-video" controls class="max-w-full max-h-full rounded-xl shadow-[0_40px_100px_rgba(0,0,0,0.5)] transition-all duration-700 ease-in-out hidden scale-90 opacity-0"></video>
        </div>
    </div>

    <!-- Modal Confirm (Dynamic) -->
    <div id="modal-confirm" class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-[300] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-surface-container-lowest w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl relative animate-fade-in text-center">
            <div id="modal-icon-container" class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-6">
                <span id="modal-icon" class="material-symbols-outlined text-3xl">info</span>
            </div>
            <h2 id="modal-title" class="text-2xl font-bold font-manrope mb-2">Confirmar</h2>
            <p id="modal-message" class="text-secondary text-sm mb-8">Tem certeza que deseja realizar esta ação?</p>
            <div class="flex items-center gap-3">
                <button id="confirm-cancel" class="flex-1 py-4 border border-on-surface/10 font-bold text-xs rounded-full hover:bg-surface-container-low transition-colors">Cancelar</button>
                <button id="confirm-ok" class="flex-1 py-4 bg-primary text-white font-bold text-xs rounded-full hover:bg-primary-container shadow-lg shadow-primary/20 active:scale-95 transition-all">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/gallery.js"></script>
</body>
</html>
