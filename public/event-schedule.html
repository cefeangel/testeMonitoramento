<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cronograma do Evento - Memory Docs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-manrope selection:bg-primary/20">

    <!-- Header / Back Button -->
    <header class="fixed top-0 left-0 right-0 z-[100] px-6 py-8 flex items-center justify-between pointer-events-none">
        <a id="btn-back" href="#" class="w-12 h-12 bg-surface-container-lowest backdrop-blur-md rounded-full border border-secondary/10 flex items-center justify-center text-on-surface pointer-events-auto shadow-2xl active:scale-90 transition-all">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
    </header>

    <!-- Hero Area -->
    <section class="relative h-[35vh] w-full overflow-hidden bg-secondary">
        <div id="event-hero-bg" class="absolute inset-0 bg-secondary/80 transition-all duration-1000 scale-110">
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-surface z-10"></div>
        </div>
        <div class="relative z-20 h-full flex flex-col items-center justify-center pt-10 px-6 text-center text-white">
            <p class="text-[10px] font-bold uppercase tracking-[0.4em] mb-4 opacity-70">Linha do Tempo</p>
            <h1 id="event-name" class="text-3xl font-extrabold tracking-tight">Evento</h1>
        </div>
    </section>

    <!-- Content Area -->
    <main class="relative z-30 -mt-12 bg-surface rounded-t-[3rem] p-10 min-h-[70vh] pb-32 shadow-[-10px_0_40px_rgba(0,0,0,0.05)]">
        
        <div class="flex items-end justify-between mb-12">
            <div class="space-y-1">
                <h2 class="text-2xl font-extrabold tracking-tighter">Cronograma</h2>
                <p class="text-[10px] font-bold text-secondary uppercase tracking-widest opacity-50">Confira cada detalhe</p>
            </div>
            <div class="w-12 h-1 bg-primary/10 rounded-full"></div>
        </div>

        <!-- Vertical Timeline List -->
        <div id="schedule-list" class="space-y-12">
            <!-- Skeleton items -->
            <div class="flex gap-8 items-start animate-pulse">
                <div class="w-12 h-12 bg-surface-container-highest rounded-full shrink-0"></div>
                <div class="flex-1 space-y-3 pt-2">
                    <div class="h-4 w-1/4 bg-surface-container-highest rounded"></div>
                    <div class="h-6 w-3/4 bg-surface-container-highest rounded"></div>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/event-schedule.js"></script>
</body>
</html>
