<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Docs - Acompanhantes</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface">
    <!-- Top Nav -->
    <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/10">
        <div class="flex justify-between items-center w-full px-8 h-20 max-w-[1440px] mx-auto">
            <div class="flex items-center gap-4">
                <a id="back-to-guests" href="#" class="flex items-center text-primary hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div class="text-2xl font-bold tracking-tighter text-primary brand-font">Memory Docs</div>
            </div>
        </div>
    </header>

    <main class="max-w-[1000px] mx-auto px-8 py-12">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12 animate-fade-in">
            <div>
                <p id="guest-sub" class="text-[10px] font-bold text-primary uppercase tracking-widest mb-2">Convidado Principal</p>
                <h1 id="guest-name" class="text-4xl font-bold font-manrope text-on-surface mb-2">---</h1>
                <p class="text-secondary text-sm">Gerencie os acompanhantes vinculados.</p>
            </div>
            <div id="add-companion-section">
                <button id="open-add-comp" class="bg-primary text-white px-8 py-4 rounded-full font-bold text-xs uppercase tracking-widest hover:shadow-lg transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">person_add</span>
                    Novo Acompanhante
                </button>
            </div>
        </div>

        <!-- List Card -->
        <div class="bg-surface-container-lowest rounded-[2.5rem] shadow-[0px_10px_40px_rgba(25,28,30,0.04)] overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-surface-container-low/50">
                        <tr>
                            <th class="px-10 py-5 text-[10px] font-bold text-secondary uppercase tracking-widest">Acompanhante</th>
                            <th class="px-10 py-5 text-[10px] font-bold text-secondary uppercase tracking-widest text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="comp-tbody" class="divide-y divide-outline-variant/10">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
            <div id="comp-empty" class="hidden text-center py-20">
                <p class="text-sm text-secondary/30 italic">Nenhum acompanhante adicionado.</p>
            </div>
        </div>
    </main>

    <!-- Modal Add Companion -->
    <div id="modal-comp" class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-surface-container-lowest w-full max-w-lg rounded-[2.5rem] p-10 shadow-2xl relative animate-fade-in scale-95 transition-transform duration-300">
            <button id="close-modal-comp" class="absolute top-6 right-6 text-secondary hover:text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2 class="text-2xl font-bold font-manrope mb-8">Novo Acompanhante</h2>
            <form id="add-comp-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-secondary uppercase tracking-widest mb-2">Nome Completo</label>
                    <input type="text" id="comp-name" required class="w-full bg-surface-container-highest border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20">
                </div>
                <div class="flex items-center gap-2 pt-4">
                    <button type="button" id="cancel-comp" class="flex-grow py-4 border border-outline-variant/30 font-bold text-xs rounded-full">Cancelar</button>
                    <button type="submit" class="flex-grow py-4 bg-primary text-white font-bold text-xs rounded-full">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Confirm Delete -->
    <div id="modal-confirm" class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-[110] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-surface-container-lowest w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl relative animate-fade-in text-center">
            <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-3xl">delete_forever</span>
            </div>
            <h2 class="text-2xl font-bold font-manrope mb-2">Remover Acompanhante</h2>
            <p class="text-secondary text-sm mb-8">Tem certeza que deseja remover este acompanhante? Esta ação não pode ser desfeita.</p>
            <div class="flex items-center gap-3">
                <button id="confirm-cancel" class="flex-1 py-4 border border-outline-variant/30 font-bold text-xs rounded-full hover:bg-surface-container-low transition-colors">Cancelar</button>
                <button id="confirm-ok" class="flex-1 py-4 bg-red-600 text-white font-bold text-xs rounded-full hover:bg-red-700 shadow-lg shadow-red-600/20 active:scale-95 transition-all">Excluir</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/companions.js"></script>
</body>
</html>
