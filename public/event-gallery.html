<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Galeria de Fotos - Memory Docs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <style>
        .snap-x-mandatory {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Effect for Focus Carousel */
        .gallery-item {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(40%) blur(1px);
            opacity: 0.5;
            transform: scale(0.85);
        }

        .gallery-item.focused {
            filter: grayscale(0) blur(0);
            opacity: 1;
            transform: scale(1);
            z-index: 10;
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-manrope selection:bg-primary/20 overflow-hidden">

    <!-- Header / Back Button -->
    <header class="fixed top-0 left-0 right-0 z-[100] px-6 py-10 flex items-center justify-between pointer-events-none">
        <a id="btn-back" href="#"
            class="w-12 h-12 bg-surface-container-lowest backdrop-blur-md rounded-full border border-secondary/10 flex items-center justify-center text-on-surface pointer-events-auto shadow-2xl active:scale-90 transition-all">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
    </header>

    <!-- Background Decoration -->
    <div
        class="fixed inset-0 pointer-events-none -z-10 bg-gradient-to-tr from-surface via-surface-container-lowest to-surface">
        <div class="absolute top-[10%] left-[10%] w-[80%] h-[40%] bg-primary/5 blur-[120px] rounded-full animate-float">
        </div>
    </div>

    <main class="h-screen flex flex-col justify-center py-20 px-0">

        <div class="text-center mb-12 animate-fade-in">
            <h1 class="text-3xl font-black tracking-tighter">Fotos Recentes</h1>
            <p id="gallery-info"
                class="text-[10px] font-bold text-secondary uppercase tracking-[0.2em] opacity-70 mt-3">Carregando
                memórias...</p>
        </div>

        <!-- The Focus Carousel -->
        <div id="gallery-carousel"
            class="flex overflow-x-auto snap-x-mandatory hide-scrollbar gap-0 items-center h-[55vh] w-full px-[15vw] scroll-smooth">
            <!-- Items injected by JS -->
            <div
                class="snap-center shrink-0 w-[70vw] aspect-[3/4] bg-surface-container-highest rounded-[3rem] animate-pulse mx-4">
            </div>
        </div>

        <div class="mt-16 flex flex-col items-center animate-fade-in stagger-2">
            <div class="flex gap-2 mb-8">
                <div class="w-2 h-2 rounded-full bg-primary/20"></div>
                <div class="w-12 h-2 rounded-full bg-primary"></div>
                <div class="w-2 h-2 rounded-full bg-primary/20"></div>
            </div>
            <p class="text-[10px] font-bold text-secondary/40 uppercase tracking-widest animate-pulse">Arraste para
                navegar</p>
        </div>

    </main>

    <!-- Full Photo Modal (from main page) -->
    <div id="modal-photo-view"
        class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[200] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="w-full h-full flex items-center justify-center p-6" id="media-view-container">
            <img id="full-photo-img" src=""
                class="max-w-full max-h-full object-contain rounded-xl shadow-2xl scale-95 transition-transform duration-300 hidden">
            <video id="full-video-player" controls
                class="max-w-full max-h-full rounded-xl shadow-2xl scale-95 transition-transform duration-300 hidden"></video>
        </div>
        <button id="close-photo-view" class="absolute top-14 right-6 text-white w-14 h-14 z-[210] flex items-center justify-center bg-black/40 backdrop-blur-xl border border-white/20 rounded-full active:scale-95 transition-all shadow-2xl">
            <span class="material-symbols-outlined text-4xl font-bold">close</span>
        </button>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/event-gallery.js"></script>
</body>

</html>
