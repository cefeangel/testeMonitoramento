<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Docs - Configurações de Perfil</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--primary)",
                        secondary: "var(--secondary)",
                        surface: "var(--surface)",
                        "on-surface": "var(--on-surface)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "primary-container": "var(--primary-container)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface transition-colors duration-300">
    <!-- Top Nav -->
    <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/10">
        <div class="flex justify-between items-center w-full px-8 h-20 max-w-[1440px] mx-auto">
            <div class="text-2xl font-bold tracking-tighter text-primary brand-font">Memory Docs</div>
            
            <nav class="hidden md:flex items-center space-x-8 font-manrope text-sm font-semibold tracking-tight">
            </nav>

            <div class="flex items-center gap-6">
                <!-- Dark Mode Toggle -->
                <button id="dark-mode-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-secondary hover:bg-surface-container-highest transition-all active:scale-90" title="Alternar Tema">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block">light_mode</span>
                </button>

                <button id="logout-btn" class="text-secondary hover:text-primary transition-all active:scale-95 flex items-center gap-2">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="hidden lg:block text-xs font-bold uppercase tracking-widest">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[800px] mx-auto px-8 py-20 min-h-[calc(100vh-80px)]">
        <div class="animate-fade-in">
            <!-- Header -->
            <div class="flex items-center gap-6 mb-12">
                <a href="/dashboard.html" class="w-12 h-12 rounded-full border border-outline-variant/20 flex items-center justify-center text-secondary hover:bg-surface-container-lowest hover:text-primary transition-all shadow-sm">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div>
                    <h1 class="text-3xl font-bold font-manrope text-on-surface mb-1">Configurações</h1>
                    <p class="text-secondary text-sm">Gerencie seu perfil de administrador.</p>
                </div>
            </div>

            <!-- Form Card -->
            <div class="bg-surface-container-lowest/40 backdrop-blur-xl rounded-[2.5rem] border border-white/20 shadow-2xl p-10 md:p-12">
                <form id="settings-form" class="space-y-8">
                    <!-- Profile Header -->
                    <div class="flex flex-col items-center gap-4 mb-8">
                        <div id="initials-bg" class="w-24 h-24 rounded-full bg-primary/10 border-4 border-primary/5 flex items-center justify-center text-primary relative group">
                            <span id="initials-display" class="text-3xl font-bold font-manrope">A</span>
                        </div>
                        <p class="text-[10px] font-bold text-primary uppercase tracking-widest">Administrador Master</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-secondary ml-4">Nome Completo</label>
                            <input id="admin-nome" name="nome" type="text" required class="w-full bg-surface-container-highest dark:bg-surface-container-highest/20 border-none rounded-[1.5rem] px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20 transition-all dark:text-white" placeholder="Seu nome">
                        </div>
                        <div class="space-y-3">
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-secondary ml-4">Endereço de Email</label>
                            <input id="admin-email" name="email" type="email" required class="w-full bg-surface-container-highest dark:bg-surface-container-highest/20 border-none rounded-[1.5rem] px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20 transition-all dark:text-white" placeholder="email@exemplo.com">
                        </div>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-secondary/10">
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-secondary ml-4">Nova Senha (Mínimo 6 caracteres)</label>
                        <div class="relative">
                            <input id="admin-senha" name="senha" type="password" class="w-full bg-surface-container-highest dark:bg-surface-container-highest/20 border-none rounded-[1.5rem] px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20 transition-all pr-12 dark:text-white" placeholder="Deixe em branco para manter a atual">
                            <button id="toggle-pw" type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary/30 hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-end pt-8">
                        <button type="submit" id="save-btn" class="bg-primary text-white px-10 py-4 rounded-full font-bold text-xs uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-lg hover:shadow-primary/20">
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
