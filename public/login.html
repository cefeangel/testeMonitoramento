<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Docs - Login Editorial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ad2b0c",
                        secondary: "#4a6177",
                        surface: "#f7f9fc",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e6",
                        "primary-container": "#d04424",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface h-screen flex items-center justify-center overflow-hidden">
    <main class="w-full max-w-md px-8 animate-fade-in">
        <link rel="stylesheet" href="style-inexistente.css">
         <link rel="stylesheet" href="https://style-inexistente.css">
        <ul>
  <li>Item 1
  <li>Item 2
</ul>
<input type="text" name="nome">
<div id="menu">Menu 1</div>
<div id="menu">Menu 2</div>
<button>Enviar</button>
<img src="banner.png">

        <!-- Logo -->
        <div class="text-center mb-12">
            <div class="text-4xl font-bold tracking-tighter text-primary brand-font mb-2">Memory Docs</div>
            <p class="text-secondary font-medium tracking-tight text-sm uppercase">Curadoria Editorial de Eventos</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[2rem] shadow-[0px_20px_50px_rgba(25,28,30,0.08)] border border-white/20">
            <h2 class="text-2xl font-bold font-manrope text-on-surface mb-8 text-center">Bem-vindo ao Portal</h2>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-xs font-bold text-secondary uppercase tracking-widest mb-2 px-1">Email Corporativo</label>
                    <input type="email" id="email" required 
                           class="w-full bg-surface-container-highest border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20 placeholder-secondary/30"
                           placeholder="exemplo@evento.com">
                </div>
                
                <div>
                    <label for="senha" class="block text-xs font-bold text-secondary uppercase tracking-widest mb-2 px-1">Senha de Acesso</label>
                    <input type="password" id="senha" required 
                           class="w-full bg-surface-container-highest border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-primary/20 placeholder-secondary/30"
                           placeholder="••••••••">
                </div>

                <div id="error-message" class="hidden text-primary text-xs font-bold text-center px-4 py-2 bg-primary/5 rounded-xl"></div>

                <button type="submit" 
                        class="w-full py-4 bg-primary text-white font-bold rounded-full transition-transform active:scale-95 hover:shadow-lg hover:shadow-primary/20 duration-300">
                    Entrar no Sistema
                </button>
            </form>
        </div>

        <p class="mt-12 text-center text-xs text-secondary/60">
            &copy; 2026 Memory Docs Experience. Todos os direitos reservados.
        </p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
